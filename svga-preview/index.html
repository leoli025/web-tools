<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVGA 画廊播放器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            padding: 30px 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* 头部和输入区 */
        .header {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1 small {
            font-size: 14px;
            font-weight: 400;
            color: #888;
        }

        .header p {
            color: #666;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .input-area {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .input-area textarea {
            flex: 1;
            min-width: 200px;
            padding: 14px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.2s;
            min-height: 56px;
            line-height: 1.6;
        }

        .input-area textarea:focus {
            outline: none;
            border-color: #4f8cf7;
            box-shadow: 0 0 0 4px rgba(79, 140, 247, 0.12);
        }

        .input-area .btn-group {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            background: #4f8cf7;
            color: white;
            white-space: nowrap;
        }

        .btn:hover {
            background: #3a7ae8;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79, 140, 247, 0.35);
        }

        .btn-outline {
            background: transparent;
            color: #4f8cf7;
            border: 2px solid #4f8cf7;
        }

        .btn-outline:hover {
            background: #f0f5ff;
            box-shadow: none;
        }

        .btn-danger {
            background: #ef4444;
        }

        .btn-danger:hover {
            background: #dc2626;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.35);
        }

        /* 统计信息 */
        .stats {
            margin-top: 16px;
            font-size: 14px;
            color: #888;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .stats strong {
            color: #333;
        }

        /* 画廊网格 */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 24px;
            margin-top: 10px;
        }

        .gallery-item {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            cursor: pointer;
            position: relative;
        }

        .gallery-item:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.12);
        }

        .gallery-item .canvas-wrapper {
            position: relative;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1 / 1;
            overflow: hidden;
        }

        .gallery-item canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .gallery-item .item-info {
            padding: 14px 16px;
            border-top: 1px solid #f1f3f5;
        }

        .gallery-item .item-info .filename {
            font-size: 13px;
            font-weight: 500;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .gallery-item .item-info .file-size {
            font-size: 12px;
            color: #999;
        }

        .gallery-item .item-info .copy-badge {
            display: inline-block;
            margin-top: 6px;
            font-size: 11px;
            color: #4f8cf7;
            background: #f0f5ff;
            padding: 2px 12px;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .gallery-item .item-info .copy-badge:hover {
            background: #dce6fe;
        }

        /* 空状态 */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: #aaa;
            font-size: 16px;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 16px;
            display: block;
        }

        /* 模态框（放大查看） */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 30px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            max-width: 90vw;
            max-height: 90vh;
            overflow: auto;
            padding: 30px;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: modalIn 0.25s ease;
        }

        @keyframes modalIn {
            from { transform: scale(0.92); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-content .close-btn {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 28px;
            background: none;
            border: none;
            cursor: pointer;
            color: #888;
            transition: color 0.2s;
            line-height: 1;
        }

        .modal-content .close-btn:hover {
            color: #333;
        }

        .modal-content canvas {
            display: block;
            width: 100%;
            max-width: 600px;
            height: auto;
            aspect-ratio: 1 / 1;
            background: #f8fafc;
            border-radius: 12px;
        }

        .modal-content .modal-link {
            margin-top: 16px;
            display: flex;
            gap: 12px;
            align-items: center;
            background: #f1f5f9;
            padding: 10px 16px;
            border-radius: 10px;
            word-break: break-all;
        }

        .modal-content .modal-link input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 13px;
            color: #333;
            outline: none;
            font-family: monospace;
        }

        .modal-content .modal-link .copy-btn {
            background: #4f8cf7;
            color: white;
            border: none;
            padding: 6px 18px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .modal-content .modal-link .copy-btn:hover {
            background: #3a7ae8;
        }

        /* Toast 提示 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1e293b;
            color: white;
            padding: 12px 28px;
            border-radius: 12px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 2000;
            pointer-events: none;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .input-area {
                flex-direction: column;
            }
            .input-area .btn-group {
                width: 100%;
            }
            .input-area .btn-group .btn {
                flex: 1;
                text-align: center;
                padding: 12px 16px;
                font-size: 14px;
            }
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 16px;
            }
            .modal-content {
                padding: 20px;
                max-width: 98vw;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 头部 -->
    <div class="header">
        <h1>
            🎨 SVGA 画廊
            <small>· 提取并预览动画</small>
        </h1>
        <p>在下方粘贴包含 <code>.svga</code> 链接的文本，点击「提取并播放」即可自动识别并生成画廊。</p>
        <div class="input-area">
            <textarea id="textInput" placeholder="例如：https://example.com/xxx.svga 或 图片1: https://xxx.svga ..."></textarea>
            <div class="btn-group">
                <button class="btn" id="extractBtn">🚀 提取并播放</button>
                <button class="btn btn-outline" id="clearBtn">清空</button>
            </div>
        </div>
        <div class="stats">
            <span>共识别到 <strong id="countDisplay">0</strong> 个 SVGA 文件</span>
            <span>点击卡片可放大查看并复制链接</span>
        </div>
    </div>

    <!-- 画廊 -->
    <div class="gallery" id="gallery">
        <div class="empty-state">
            <span class="icon">🖼️</span>
            暂无内容，请在上方输入文本提取 SVGA 链接
        </div>
    </div>
</div>

<!-- 模态框 -->
<div class="modal-overlay" id="modal">
    <div class="modal-content">
        <button class="close-btn" id="modalClose">✕</button>
        <canvas id="modalCanvas"></canvas>
        <div class="modal-link">
            <input type="text" id="modalLinkInput" readonly>
            <button class="copy-btn" id="modalCopyBtn">复制链接</button>
        </div>
    </div>
</div>

<!-- Toast 提示 -->
<div class="toast" id="toast"></div>

<!-- 引入 SVGA 库 (CDN) -->
<script src="https://cdn.jsdelivr.net/npm/svga-web/svga-web.min.js"></script>

<script>
    (function() {
        // ---------- DOM 引用 ----------
        const textInput = document.getElementById('textInput');
        const extractBtn = document.getElementById('extractBtn');
        const clearBtn = document.getElementById('clearBtn');
        const gallery = document.getElementById('gallery');
        const countDisplay = document.getElementById('countDisplay');

        // 模态框
        const modal = document.getElementById('modal');
        const modalCanvas = document.getElementById('modalCanvas');
        const modalLinkInput = document.getElementById('modalLinkInput');
        const modalCopyBtn = document.getElementById('modalCopyBtn');
        const modalClose = document.getElementById('modalClose');

        const toastEl = document.getElementById('toast');

        // 存储当前所有播放器实例，便于清理
        let playerInstances = [];

        // ---------- 工具函数 ----------
        function showToast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            clearTimeout(toastEl._timer);
            toastEl._timer = setTimeout(() => {
                toastEl.classList.remove('show');
            }, 2200);
        }

        // 从文本中提取所有 .svga 链接 (忽略大小写)
        function extractSvgaUrls(text) {
            // 匹配 http:// 或 https:// 开头，以 .svga 结尾的链接（不区分大小写）
            const regex = /https?:\/\/[^\s<>"']+?\.svga/gi;
            const matches = text.match(regex);
            return matches ? [...new Set(matches)] : []; // 去重
        }

        // 获取文件名
        function getFileName(url) {
            try {
                const parts = url.split('/');
                let name = parts[parts.length - 1];
                if (name.length > 40) name = name.substring(0, 36) + '…';
                return name;
            } catch {
                return 'unknown.svga';
            }
        }

        // 格式化文件大小（通过 head 请求获取，仅示意）
        async function getFileSize(url) {
            try {
                const resp = await fetch(url, { method: 'HEAD' });
                const size = resp.headers.get('content-length');
                if (size) {
                    const kb = (parseInt(size) / 1024).toFixed(0);
                    return `${kb} KB`;
                }
                return '未知大小';
            } catch {
                return '未知大小';
            }
        }

        // ---------- 播放 SVGA 的核心函数 ----------
        async function playSvgaOnCanvas(canvasElement, url) {
            return new Promise((resolve, reject) => {
                const SVGA = window.SVGA || window.svga;
                if (!SVGA) {
                    reject(new Error('SVGA 库未加载，请检查网络。'));
                    return;
                }

                const { Downloader, Parser, Player } = SVGA;

                const downloader = new Downloader();
                const parser = new Parser();
                const player = new Player(canvasElement);

                downloader.get(url)
                    .then(fileData => parser.do(fileData))
                    .then(svgaData => {
                        player.set({ loop: 0 }); // 无限循环
                        return player.mount(svgaData);
                    })
                    .then(() => {
                        player.start();
                        // 保存实例以便后续清理
                        playerInstances.push(player);
                        resolve(player);
                    })
                    .catch(err => {
                        // 如果加载失败，在 canvas 上显示错误信息
                        const ctx = canvasElement.getContext('2d');
                        ctx.clearRect(0, 0, canvasElement.width, canvasElement.height);
                        ctx.fillStyle = '#f0f0f0';
                        ctx.fillRect(0, 0, canvasElement.width, canvasElement.height);
                        ctx.fillStyle = '#999';
                        ctx.font = '14px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('加载失败', canvasElement.width/2, canvasElement.height/2);
                        reject(err);
                    });
            });
        }

        // ---------- 渲染画廊 ----------
        async function renderGallery(urls) {
            // 清理旧的播放器
            playerInstances.forEach(p => p.destroy && p.destroy());
            playerInstances = [];

            // 更新计数
            countDisplay.textContent = urls.length;

            if (urls.length === 0) {
                gallery.innerHTML = `
                    <div class="empty-state">
                        <span class="icon">🔍</span>
                        未找到任何 <strong>.svga</strong> 链接，请检查输入内容
                    </div>
                `;
                return;
            }

            // 构建卡片 HTML
            let html = '';
            const urlItems = urls.map(url => ({
                url,
                name: getFileName(url),
                // size: await getFileSize(url) // 可选的异步获取大小，会延迟渲染，暂时注释
            }));

            // 先创建所有卡片的结构
            for (const item of urlItems) {
                html += `
                    <div class="gallery-item" data-url="${item.url}">
                        <div class="canvas-wrapper">
                            <canvas class="svga-canvas" width="400" height="400"></canvas>
                        </div>
                        <div class="item-info">
                            <div class="filename" title="${item.url}">${item.name}</div>
                            <div class="file-size">${item.size || '加载中...'}</div>
                            <span class="copy-badge" data-url="${item.url}">📋 复制链接</span>
                        </div>
                    </div>
                `;
            }

            gallery.innerHTML = html;

            // 逐个播放
            const cards = gallery.querySelectorAll('.gallery-item');
            const loadPromises = [];

            cards.forEach((card, index) => {
                const url = card.dataset.url;
                const canvas = card.querySelector('.svga-canvas');

                // 异步加载并播放
                const loadPromise = playSvgaOnCanvas(canvas, url)
                    .then(() => {
                        // 加载成功后更新文件大小信息（可选）
                        return getFileSize(url).then(size => {
                            const sizeEl = card.querySelector('.file-size');
                            if (sizeEl) sizeEl.textContent = size;
                        });
                    })
                    .catch(err => {
                        console.warn(`播放 ${url} 失败:`, err);
                        // 错误已经在 canvas 上显示了
                    });

                loadPromises.push(loadPromise);

                // 点击卡片打开模态框（放大）
                card.addEventListener('click', (e) => {
                    // 如果点击的是复制按钮，不触发模态框
                    if (e.target.classList.contains('copy-badge')) return;
                    openModal(url);
                });

                // 复制按钮单独处理
                const copyBadge = card.querySelector('.copy-badge');
                if (copyBadge) {
                    copyBadge.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const u = copyBadge.dataset.url;
                        copyToClipboard(u);
                    });
                }
            });

            // 等待所有加载完成（可选）
            await Promise.allSettled(loadPromises);
        }

        // ---------- 模态框 ----------
        let modalPlayer = null;

        async function openModal(url) {
            modal.classList.add('active');
            modalLinkInput.value = url;

            // 清除之前的播放器
            if (modalPlayer) {
                modalPlayer.destroy && modalPlayer.destroy();
                modalPlayer = null;
            }

            // 在新的 canvas 上播放
            try {
                modalPlayer = await playSvgaOnCanvas(modalCanvas, url);
            } catch (err) {
                console.warn('模态框播放失败:', err);
            }
        }

        function closeModal() {
            modal.classList.remove('active');
            if (modalPlayer) {
                modalPlayer.destroy && modalPlayer.destroy();
                modalPlayer = null;
            }
        }

        // ---------- 复制功能 ----------
        function copyToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text)
                    .then(() => showToast('✅ 链接已复制到剪贴板'))
                    .catch(() => fallbackCopy(text));
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('✅ 链接已复制到剪贴板');
            } catch {
                showToast('❌ 复制失败，请手动复制');
            }
            document.body.removeChild(textarea);
        }

        // ---------- 事件绑定 ----------
        // 提取按钮
        extractBtn.addEventListener('click', () => {
            const text = textInput.value;
            const urls = extractSvgaUrls(text);
            renderGallery(urls);
        });

        // 清空按钮
        clearBtn.addEventListener('click', () => {
            textInput.value = '';
            renderGallery([]);
        });

        // 模态框关闭
        modalClose.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        // 模态框复制
        modalCopyBtn.addEventListener('click', () => {
            copyToClipboard(modalLinkInput.value);
        });

        // 键盘快捷键：ESC 关闭模态框
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // 页面加载时自动提取示例
        window.addEventListener('load', () => {
            const text = textInput.value;
            const urls = extractSvgaUrls(text);
            renderGallery(urls);
        });
    })();
</script>

</body>
</html>
