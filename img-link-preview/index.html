<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>图片链接提取 & 预览工具</title>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 30px 20px;
        }

        .app {
            max-width: 1400px;
            width: 100%;
        }

        /* ===== 头部 ===== */
        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1e293b;
            letter-spacing: -0.5px;
        }

        .header h1 span {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: #64748b;
            font-size: 15px;
            margin-top: 6px;
        }

        /* ===== 输入区域 ===== */
        .input-section {
            background: #ffffff;
            border-radius: 20px;
            padding: 28px 30px 30px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            border: 1px solid #e9edf2;
            margin-bottom: 28px;
            transition: box-shadow 0.2s;
        }

        .input-section:focus-within {
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.10);
            border-color: #3b82f6;
        }

        .input-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: #1e293b;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .input-label .badge {
            background: #e9edf2;
            color: #475569;
            font-size: 12px;
            font-weight: 500;
            padding: 0 10px;
            border-radius: 20px;
            line-height: 22px;
        }

        textarea {
            width: 100%;
            height: 130px;
            padding: 14px 16px;
            font-size: 14px;
            font-family: 'Segoe UI', 'SF Mono', monospace;
            border: 1px solid #d1d9e6;
            border-radius: 12px;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
            background: #fafcff;
            color: #0f172a;
            line-height: 1.7;
        }

        textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }

        textarea::placeholder {
            color: #94a3b8;
        }

        .action-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-top: 16px;
            gap: 12px;
        }

        .action-left {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 26px;
            font-weight: 600;
            font-size: 14px;
            border: none;
            border-radius: 40px;
            background: #e9edf2;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.18s;
            white-space: nowrap;
        }

        .btn:hover {
            background: #dce1e9;
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: #fff;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.30);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.35);
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #475569;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        .btn-danger {
            background: #fee2e2;
            color: #b91c1c;
        }

        .btn-danger:hover {
            background: #fecaca;
        }

        .stats {
            font-size: 14px;
            color: #64748b;
            background: #f1f5f9;
            padding: 6px 16px;
            border-radius: 40px;
            white-space: nowrap;
        }

        .stats strong {
            color: #0f172a;
            font-weight: 700;
        }

        /* ===== 结果区域 ===== */
        .result-section {
            background: #ffffff;
            border-radius: 20px;
            padding: 24px 28px 28px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            border: 1px solid #e9edf2;
            min-height: 200px;
            transition: all 0.2s;
        }

        .result-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 10px;
        }

        .result-title {
            font-weight: 700;
            font-size: 18px;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .result-title .count {
            background: #e9edf2;
            font-size: 13px;
            font-weight: 600;
            padding: 0 14px;
            border-radius: 40px;
            line-height: 28px;
            color: #334155;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px 50px;
            color: #94a3b8;
        }

        .empty-state .icon {
            font-size: 56px;
            margin-bottom: 14px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 15px;
            max-width: 420px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* ===== 图片网格 ===== */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 18px;
        }

        .image-card {
            background: #fafcff;
            border-radius: 14px;
            border: 1px solid #eef2f6;
            overflow: hidden;
            transition: transform 0.15s, box-shadow 0.18s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .image-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            border-color: #d1d9e6;
        }

        .image-card .thumb {
            width: 100%;
            aspect-ratio: 16 / 10;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .image-card .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.25s;
            display: block;
        }

        .image-card .thumb img.loading {
            opacity: 0.3;
        }

        .image-card .thumb .loader {
            position: absolute;
            width: 28px;
            height: 28px;
            border: 3px solid #e2e8f0;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            pointer-events: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .image-card .thumb .error-placeholder {
            color: #94a3b8;
            font-size: 13px;
            text-align: center;
            padding: 12px;
        }

        .image-card .info {
            padding: 12px 14px 14px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .image-card .info .url {
            font-size: 12px;
            color: #64748b;
            word-break: break-all;
            line-height: 1.5;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .image-card .info .url a {
            color: #3b82f6;
            text-decoration: none;
        }

        .image-card .info .url a:hover {
            text-decoration: underline;
        }

        .image-card .info .index-badge {
            font-size: 11px;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 0.3px;
        }

        /* ===== 灯箱 (Lightbox) ===== */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.82);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
            animation: fadeIn 0.2s ease;
        }

        .lightbox.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.97);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .lightbox .close-btn {
            position: absolute;
            top: 24px;
            right: 30px;
            background: rgba(255, 255, 255, 0.12);
            border: none;
            color: #fff;
            font-size: 32px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            z-index: 10;
        }

        .lightbox .close-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .lightbox .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.10);
            border: none;
            color: #fff;
            font-size: 28px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            user-select: none;
        }

        .lightbox .nav-btn:hover {
            background: rgba(255, 255, 255, 0.22);
        }

        .lightbox .nav-btn.prev {
            left: 28px;
        }
        .lightbox .nav-btn.next {
            right: 28px;
        }

        .lightbox .nav-btn.disabled {
            opacity: 0.2;
            pointer-events: none;
        }

        .lightbox .lb-image-wrap {
            max-width: 90vw;
            max-height: 82vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .lightbox .lb-image-wrap img {
            max-width: 100%;
            max-height: 82vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            background: #0f172a;
        }

        /* ---- 底部工具栏（计数 + 复制按钮） ---- */
        .lightbox .lb-toolbar {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            padding: 8px 24px;
            border-radius: 40px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.3px;
            user-select: none;
            z-index: 10;
            white-space: nowrap;
        }

        .lightbox .lb-toolbar .lb-counter {
            color: rgba(255, 255, 255, 0.8);
        }

        .lightbox .lb-toolbar .lb-copy-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(4px);
        }

        .lightbox .lb-toolbar .lb-copy-btn:hover {
            background: rgba(255, 255, 255, 0.22);
            transform: scale(1.02);
        }

        .lightbox .lb-toolbar .lb-copy-btn:active {
            transform: scale(0.96);
        }

        .lightbox .lb-toolbar .lb-copy-btn.copied {
            background: rgba(34, 197, 94, 0.25);
            border-color: rgba(34, 197, 94, 0.4);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 700px) {
            body {
                padding: 16px 12px;
            }
            .input-section {
                padding: 20px 18px;
            }
            .result-section {
                padding: 18px 16px 20px;
            }
            .action-row {
                flex-direction: column;
                align-items: stretch;
            }
            .action-left {
                flex-wrap: wrap;
            }
            .action-left .btn {
                flex: 1;
                justify-content: center;
                min-width: 100px;
            }
            .stats {
                text-align: center;
            }
            .image-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 12px;
            }
            .lightbox .nav-btn {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
            .lightbox .nav-btn.prev {
                left: 10px;
            }
            .lightbox .nav-btn.next {
                right: 10px;
            }
            .lightbox .close-btn {
                top: 14px;
                right: 16px;
                width: 44px;
                height: 44px;
                font-size: 26px;
            }
            .lightbox .lb-toolbar {
                bottom: 18px;
                padding: 6px 16px;
                gap: 14px;
                font-size: 12px;
            }
            .lightbox .lb-toolbar .lb-copy-btn {
                padding: 2px 12px;
                font-size: 12px;
            }
            .header h1 {
                font-size: 22px;
            }
        }

        @media (max-width: 450px) {
            .image-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .image-card .info .url {
                font-size: 11px;
                -webkit-line-clamp: 1;
            }
            .image-card .info {
                padding: 8px 10px 10px;
            }
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #eef2f6;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body>

<div class="app">

    <!-- 头部 -->
    <header class="header">
        <h1>🖼️ <span>图片链接提取器</span></h1>
        <p>从文本中自动提取所有 https 图片链接，支持预览 & 画廊浏览</p>
    </header>

    <!-- 输入区域 -->
    <section class="input-section">
        <div class="input-label">
            <span>📝 输入文本</span>
            <span class="badge">支持 YAML / JSON / HTML / 纯文本</span>
        </div>
        <textarea id="textInput" placeholder="粘贴包含图片链接的文本…&#10;例如：Icon: &quot;https://example.com/image.png&quot;"></textarea>
        <div class="action-row">
            <div class="action-left">
                <button class="btn btn-primary" id="extractBtn">
                    🔍 提取图片链接
                </button>
                <button class="btn btn-secondary" id="clearBtn">
                    🗑️ 清空
                </button>
                <button class="btn btn-secondary" id="sampleBtn">
                    📄 示例文本
                </button>
            </div>
            <span class="stats" id="stats">共 <strong id="countDisplay">0</strong> 张图片</span>
        </div>
    </section>

    <!-- 结果区域 -->
    <section class="result-section" id="resultSection">
        <div class="result-header">
            <div class="result-title">
                🖼️ 提取结果
                <span class="count" id="resultCount">0</span>
            </div>
        </div>

        <!-- 空状态 -->
        <div class="empty-state" id="emptyState">
            <div class="icon">🖼️</div>
            <p>还没有提取到图片链接<br />在上方输入文本后点击 「提取图片链接」</p>
        </div>

        <!-- 图片网格 -->
        <div class="image-grid" id="imageGrid" style="display: none;"></div>
    </section>
</div>

<!-- ===== 灯箱 ===== -->
<div class="lightbox" id="lightbox">
    <button class="close-btn" id="lbClose">✕</button>
    <button class="nav-btn prev" id="lbPrev">‹</button>
    <button class="nav-btn next" id="lbNext">›</button>
    <div class="lb-image-wrap">
        <img id="lbImage" src="" alt="预览" />
    </div>
    <!-- 底部工具栏：计数 + 复制按钮 -->
    <div class="lb-toolbar">
        <span class="lb-counter" id="lbCounter">1 / 1</span>
        <button class="lb-copy-btn" id="lbCopy">📋 复制链接</button>
    </div>
</div>

<script>
    (function() {
        'use strict';

        // ===== DOM 引用 =====
        const textInput = document.getElementById('textInput');
        const extractBtn = document.getElementById('extractBtn');
        const clearBtn = document.getElementById('clearBtn');
        const sampleBtn = document.getElementById('sampleBtn');
        const imageGrid = document.getElementById('imageGrid');
        const emptyState = document.getElementById('emptyState');
        const countDisplay = document.getElementById('countDisplay');
        const resultCount = document.getElementById('resultCount');
        const stats = document.getElementById('stats');

        // 灯箱
        const lightbox = document.getElementById('lightbox');
        const lbImage = document.getElementById('lbImage');
        const lbClose = document.getElementById('lbClose');
        const lbPrev = document.getElementById('lbPrev');
        const lbNext = document.getElementById('lbNext');
        const lbCounter = document.getElementById('lbCounter');
        const lbCopy = document.getElementById('lbCopy');

        // ===== 状态 =====
        let currentImages = []; // 存放 { url, index }
        let currentIndex = 0;

        // ===== 工具：提取图片链接 =====
        function extractImageUrls(text) {
            // 匹配 https:// 开头，常见图片扩展名结尾 (忽略大小写)
            // 允许查询参数 ?... 和锚点 #...
            const regex = /https?:\/\/[^\s<>"']+?\.(?:jpg|jpeg|png|gif|webp|bmp|tiff?|ico|avif|heic|heif)(?:\?[^\s<>"']*)?(?:#[^\s<>"']*)?/gi;
            const matches = text.match(regex);
            if (!matches) return [];
            // 去重 (保留首次出现顺序)
            const seen = new Set();
            const unique = [];
            for (const url of matches) {
                // 标准化：去除末尾多余字符（部分匹配可能带标点）
                let cleaned = url;
                cleaned = cleaned.replace(/[.,;:!?)]$/, '');
                if (!seen.has(cleaned)) {
                    seen.add(cleaned);
                    unique.push(cleaned);
                }
            }
            return unique;
        }

        // ===== 渲染图片网格 =====
        function renderImages(urls) {
            currentImages = urls.map((url, idx) => ({ url, index: idx }));

            // 更新计数
            const total = urls.length;
            countDisplay.textContent = total;
            resultCount.textContent = total;
            stats.style.display = 'inline-block';

            if (total === 0) {
                imageGrid.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            imageGrid.style.display = 'grid';
            imageGrid.innerHTML = '';

            urls.forEach((url, idx) => {
                const card = document.createElement('div');
                card.className = 'image-card';
                card.setAttribute('data-index', idx);

                // 缩略图容器
                const thumb = document.createElement('div');
                thumb.className = 'thumb';

                // loader
                const loader = document.createElement('div');
                loader.className = 'loader';
                thumb.appendChild(loader);

                const img = document.createElement('img');
                img.alt = `图片 ${idx + 1}`;
                img.className = 'loading';
                img.loading = 'lazy';
                img.dataset.src = url;

                // 图片加载完成
                img.addEventListener('load', function() {
                    this.classList.remove('loading');
                    const loaderEl = this.parentElement.querySelector('.loader');
                    if (loaderEl) loaderEl.remove();
                });

                img.addEventListener('error', function() {
                    this.classList.remove('loading');
                    const loaderEl = this.parentElement.querySelector('.loader');
                    if (loaderEl) loaderEl.remove();
                    // 显示占位
                    const placeholder = document.createElement('div');
                    placeholder.className = 'error-placeholder';
                    placeholder.textContent = '⚠️ 加载失败';
                    this.parentElement.appendChild(placeholder);
                    this.style.display = 'none';
                });

                // 点击卡片打开灯箱
                card.addEventListener('click', function(e) {
                    const idx = parseInt(this.getAttribute('data-index'), 10);
                    openLightbox(idx);
                });

                thumb.appendChild(img);
                card.appendChild(thumb);

                // 信息区
                const info = document.createElement('div');
                info.className = 'info';

                const urlSpan = document.createElement('div');
                urlSpan.className = 'url';
                const displayUrl = url.length > 60 ? url.slice(0, 55) + '…' : url;
                const link = document.createElement('a');
                link.href = url;
                link.target = '_blank';
                link.title = url;
                link.textContent = displayUrl;
                urlSpan.appendChild(link);

                const badge = document.createElement('div');
                badge.className = 'index-badge';
                badge.textContent = `#${idx + 1}`;

                info.appendChild(badge);
                info.appendChild(urlSpan);
                card.appendChild(info);

                imageGrid.appendChild(card);

                // 开始加载图片 (设置 src 触发加载)
                img.src = url;
            });
        }

        // ===== 灯箱逻辑 =====
        function openLightbox(index) {
            if (!currentImages.length) return;
            if (index < 0) index = 0;
            if (index >= currentImages.length) index = currentImages.length - 1;
            currentIndex = index;
            updateLightbox();
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
            // 重置复制按钮状态
            lbCopy.textContent = '📋 复制链接';
            lbCopy.classList.remove('copied');
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
        }

        function updateLightbox() {
            const item = currentImages[currentIndex];
            if (!item) return;
            lbImage.src = item.url;
            lbImage.alt = `图片 ${currentIndex + 1}`;
            lbCounter.textContent = `${currentIndex + 1} / ${currentImages.length}`;

            // 禁用 / 启用导航按钮
            lbPrev.classList.toggle('disabled', currentIndex === 0);
            lbNext.classList.toggle('disabled', currentIndex === currentImages.length - 1);
        }

        function prevImage() {
            if (currentIndex > 0) {
                currentIndex--;
                updateLightbox();
                // 重置复制按钮状态
                lbCopy.textContent = '📋 复制链接';
                lbCopy.classList.remove('copied');
            }
        }

        function nextImage() {
            if (currentIndex < currentImages.length - 1) {
                currentIndex++;
                updateLightbox();
                lbCopy.textContent = '📋 复制链接';
                lbCopy.classList.remove('copied');
            }
        }

        // ===== 复制链接功能 =====
        async function copyCurrentLink() {
            const item = currentImages[currentIndex];
            if (!item) return;
            const url = item.url;
            try {
                await navigator.clipboard.writeText(url);
                // 显示复制成功状态
                lbCopy.textContent = '✅ 已复制';
                lbCopy.classList.add('copied');
                // 2秒后恢复
                setTimeout(() => {
                    lbCopy.textContent = '📋 复制链接';
                    lbCopy.classList.remove('copied');
                }, 2000);
            } catch (err) {
                // 降级方案
                const textArea = document.createElement('textarea');
                textArea.value = url;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    lbCopy.textContent = '✅ 已复制';
                    lbCopy.classList.add('copied');
                    setTimeout(() => {
                        lbCopy.textContent = '📋 复制链接';
                        lbCopy.classList.remove('copied');
                    }, 2000);
                } catch (e) {
                    alert('复制失败，请手动复制链接：\n' + url);
                }
                document.body.removeChild(textArea);
            }
        }

        // 键盘事件
        function handleKeydown(e) {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'Escape') {
                closeLightbox();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevImage();
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                nextImage();
            } else if (e.key === 'c' || e.key === 'C') {
                // Ctrl+C 或 C 键复制 (不干扰系统复制)
                if (!e.ctrlKey && !e.metaKey) {
                    copyCurrentLink();
                }
            }
        }

        // ===== 主提取逻辑 =====
        function performExtract() {
            const text = textInput.value;
            const urls = extractImageUrls(text);
            renderImages(urls);
            document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // ===== 示例文本 =====
        function loadSample() {
            textInput.value =
                `https://images.pexels.com/photos/14230233/pexels-photo-14230233.jpeg
                https://images.pexels.com/photos/14230236/pexels-photo-14230236.jpeg
                # 更多图片
                - https://example.com/photo.jpg?width=800
                - https://cdn.test.org/images/logo.webp
                - https://picsum.photos/seed/1/400/300
                - https://picsum.photos/seed/2/400/300
                - https://picsum.photos/seed/3/400/300
                `;
            performExtract();
        }

        // ===== 清空 =====
        function clearAll() {
            textInput.value = '';
            renderImages([]);
            imageGrid.style.display = 'none';
            emptyState.style.display = 'block';
            countDisplay.textContent = '0';
            resultCount.textContent = '0';
            closeLightbox();
        }

        // ===== 初始化事件绑定 =====
        function init() {
            extractBtn.addEventListener('click', performExtract);
            clearBtn.addEventListener('click', clearAll);
            sampleBtn.addEventListener('click', loadSample);

            // 灯箱事件
            lbClose.addEventListener('click', closeLightbox);
            lbPrev.addEventListener('click', prevImage);
            lbNext.addEventListener('click', nextImage);
            lbCopy.addEventListener('click', copyCurrentLink);

            // 点击灯箱背景关闭 (点击图片本身不关闭)
            lightbox.addEventListener('click', function(e) {
                if (e.target === this) closeLightbox();
            });

            // 键盘
            document.addEventListener('keydown', handleKeydown);

            // Ctrl+Enter 快捷键提取
            textInput.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    performExtract();
                }
            });

            // 初次加载显示示例
            loadSample();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

    })();
</script>
</body>
</html>
